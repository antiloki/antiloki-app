# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/seo-report.json replaces this one.
id: seo-report
name: SEO and audit reports
description: 'A report a team hands over: its sections exist, nothing is left unfinished, its links hold.'
axes:
- Completeness
- Integrity
- Structure
kinds:
- markdown
version: 1
paths:
- reports/**
- '**/reports/**'
- '**/*report*.md'
- '**/*seo*.md'
- '**/*audit*.md'
laws:
- key: report-sections
  title: Summary, findings and recommendations are present
  domain: report
  axis: Completeness
  kinds: []
  detector: structure
  config:
    check: required_sections
    names:
    - Summary
    - Findings
    - Recommendations
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A report has the three sections.
  fix: Add the missing section.
  fixtures:
    pass:
    - name: ok
      text: |
        # R

        ## Summary

        x y z.

        ## Findings

        x y z.

        ## Recommendations

        x y z.
    fail:
    - name: short
      text: |
        # R

        ## Summary

        x y z.
- key: report-no-placeholder
  title: No placeholder in the report
  domain: report
  axis: Completeness
  kinds: []
  detector: pattern
  config:
    unit: file
    regex: lorem ipsum|\[(?:insert|your|add)[^\]]*\]|\{\{[^}]+\}\}|\bTODO\b|\bTBD\b
    ignore_case: false
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A report ships finished.
  fix: Finish the passage.
  fixtures:
    pass:
    - name: ok
      text: |
        # R

        Done.
    fail:
    - name: todo
      text: |
        # R

        TBD.
- key: report-links-resolve
  title: Links resolve
  domain: report
  axis: Integrity
  kinds: []
  detector: link
  config: {}
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Links inside the report hold.
  fix: Fix the target.
  fixtures:
    pass:
    - name: ok
      text: |
        # R

        [top](#r)
    fail:
    - name: bad
      text: |
        # R

        [x](#nowhere)
- key: report-no-empty-sections
  title: No empty section
  domain: report
  axis: Structure
  kinds: []
  detector: structure
  config:
    check: no_empty_sections
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Every heading has content.
  fix: Write it or remove it.
  fixtures:
    pass:
    - name: ok
      text: |
        # R

        ## S

        text here
    fail:
    - name: empty
      text: |
        # R

        ## S

        ## T

        text
