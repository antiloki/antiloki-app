# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/technical-docs.json replaces this one.
id: technical-docs
name: Technical documents
description: Structure, completeness and integrity of READMEs, guides, RFCs and docs.
axes:
- Structure
- Completeness
- Integrity
- Accessibility
- Clarity
kinds:
- markdown
version: 1
exclude:
- copy/**
- '**/copy/**'
- marketing/**
- '**/marketing/**'
- reports/**
- '**/reports/**'
- '**/*report*.md'
- '**/*seo*.md'
- '**/*audit*.md'
- '**/landing*'
- '**/email*'
- ads/**
- '**/ads/**'
laws:
- key: docs-heading-levels
  title: Headings do not skip a level
  domain: docs
  axis: Structure
  kinds: []
  detector: structure
  config:
    check: heading_levels
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A heading goes one level deeper at a time.
  fix: Add the missing level or promote the heading.
  fixtures:
    pass:
    - name: ok
      text: |
        # A

        ## B

        Some text here.
    fail:
    - name: jump
      text: |
        # A

        ### C

        Some text here.
- key: docs-single-h1
  title: One top-level heading
  domain: docs
  axis: Structure
  kinds: []
  detector: structure
  config:
    check: single_h1
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A document has exactly one H1.
  fix: Keep one H1 and demote the others.
  fixtures:
    pass:
    - name: ok
      text: |
        # A

        text here
    fail:
    - name: two
      text: |
        # A

        # B

        text
- key: docs-no-empty-sections
  title: No heading without content
  domain: docs
  axis: Structure
  kinds: []
  detector: structure
  config:
    check: no_empty_sections
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Every heading has content or sub-sections.
  fix: Write the section or remove the heading.
  fixtures:
    pass:
    - name: ok
      text: |
        # A

        ## B

        body text here
    fail:
    - name: empty
      text: |
        # A

        ## B

        ## C

        body text here
- key: docs-no-todo
  title: No TODO left in the text
  domain: docs
  axis: Completeness
  kinds: []
  detector: pattern
  config:
    unit: file
    regex: \b(?:TODO|FIXME|TBD|XXX)\b
    ignore_case: false
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Finished documents carry no TODO markers.
  fix: Finish the passage or remove the marker.
  fixtures:
    pass:
    - name: ok
      text: |
        # A

        Done.
    fail:
    - name: todo
      text: |
        # A

        TODO: write this.
- key: docs-no-placeholder
  title: No placeholder text
  domain: docs
  axis: Completeness
  kinds: []
  detector: pattern
  config:
    unit: file
    regex: lorem ipsum|\[(?:insert|your|add)[^\]]*\]|\{\{[^}]+\}\}|<placeholder>
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Placeholders are replaced before a document ships.
  fix: Replace the placeholder with the real content.
  fixtures:
    pass:
    - name: ok
      text: |
        # A

        Real text.
    fail:
    - name: lorem
      text: |
        # A

        Lorem ipsum dolor sit amet.
    - name: slot
      text: |
        # A

        Hello [insert name].
- key: docs-alt-text
  title: Images have alt text
  domain: docs
  axis: Accessibility
  kinds: []
  detector: structure
  config:
    check: alt_text
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Every image says what it shows.
  fix: Describe the image between the brackets.
  fixtures:
    pass:
    - name: ok
      text: |
        # A

        ![A diagram of the flow](https://example.com/a.png)
    fail:
    - name: none
      text: |
        # A

        ![](https://example.com/a.png)
- key: docs-links-resolve
  title: Internal links and anchors resolve
  domain: docs
  axis: Integrity
  kinds: []
  detector: link
  config: {}
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A link points at something that exists.
  fix: Fix the target or the heading it names.
  fixtures:
    pass:
    - name: anchor
      text: |
        # A

        See [top](#a).
    fail:
    - name: missing
      text: |
        # A

        See [nowhere](#missing).
- key: docs-paragraph-length
  title: Paragraphs stay readable
  domain: docs
  axis: Clarity
  kinds: []
  detector: count
  config:
    unit: paragraph
    attr: words
    max: 120
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A paragraph over 120 words is split.
  fix: Split the paragraph at a change of idea.
  fixtures:
    pass:
    - name: short
      text: |
        # A

        word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word.
    fail:
    - name: long
      text: |
        # A

        word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word.
- key: docs-fence-language
  title: Code blocks name their language
  domain: docs
  axis: Clarity
  kinds: []
  detector: structure
  config:
    check: fence_language
  severity: info
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Fenced code says what it is.
  fix: Add the language after the opening fence.
  fixtures:
    pass:
    - name: ok
      text: |
        # A

        ```js
        x = 1
        ```
    fail:
    - name: bare
      text: |
        # A

        ```
        x = 1
        ```
- key: docs-no-repeats
  title: No paragraph written twice
  domain: docs
  axis: Clarity
  kinds: []
  detector: similarity
  config:
    min_words: 8
    max_distance: 3
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A paragraph appears once.
  fix: Remove the repeat or link to the first.
  fixtures:
    pass:
    - name: ok
      text: |
        # A

        The quick brown fox jumps over the lazy dog today.

        A completely different sentence about something else entirely here.
    fail:
    - name: dup
      text: |
        # A

        The quick brown fox jumps over the lazy dog today.

        The quick brown fox jumps over the lazy dog today.
