# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/project-plan.json replaces this one.
id: project-plan
name: Plans and task lists
description: 'A plan in YAML or JSON (`plan`, `roadmap`, `tasks` in the name): tasks with an id, a title and an owner, no repeats, valid states, dependencies that exist.'
axes:
- Completeness
- Consistency
kinds:
- yaml
- json
version: 1
paths:
- '**/plan.*'
- '**/roadmap.*'
- '**/tasks.*'
- '**/*-plan.*'
- '**/*_plan.*'
laws:
- key: plan-parses
  title: The plan parses
  domain: plan
  axis: Consistency
  kinds:
  - yaml
  - json
  detector: structure
  config:
    check: parses
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A plan is valid YAML or JSON.
  fix: Fix the syntax error.
  fixtures:
    pass:
    - name: ok
      text: |
        tasks:
          - id: a
            title: A
            owner: me
    fail:
    - name: bad
      text: |
        tasks: [
- key: plan-has-tasks
  title: The plan has tasks
  domain: plan
  axis: Completeness
  kinds:
  - yaml
  - json
  detector: schema
  config:
    required:
    - tasks
    min_items:
      tasks: 1
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A plan lists at least one task.
  fix: Add the tasks.
  fixtures:
    pass:
    - name: ok
      text: |
        tasks:
          - id: a
            title: A
            owner: me
    fail:
    - name: none
      text: |
        name: empty
- key: plan-task-fields
  title: Every task has an id, a title and an owner
  domain: plan
  axis: Completeness
  kinds:
  - yaml
  - json
  detector: schema
  config:
    required_each:
      tasks:
      - id
      - title
      - owner
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A task someone owns.
  fix: Name the owner.
  fixtures:
    pass:
    - name: ok
      text: |
        tasks:
          - id: a
            title: A
            owner: me
    fail:
    - name: no-owner
      text: |
        tasks:
          - id: a
            title: A
- key: plan-unique-ids
  title: Task ids are unique
  domain: plan
  axis: Consistency
  kinds:
  - yaml
  - json
  detector: schema
  config:
    unique:
    - tasks[].id
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: An id names one task.
  fix: Rename the repeated id.
  fixtures:
    pass:
    - name: ok
      text: |
        tasks:
          - id: a
            title: A
            owner: me
          - id: b
            title: B
            owner: me
    fail:
    - name: dup
      text: |
        tasks:
          - id: a
            title: A
            owner: me
          - id: a
            title: B
            owner: me
- key: plan-status
  title: Task status is a known state
  domain: plan
  axis: Consistency
  kinds:
  - yaml
  - json
  detector: schema
  config:
    enums:
      tasks[].status:
      - todo
      - doing
      - done
      - blocked
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Status is todo, doing, done or blocked.
  fix: Use one of the four.
  fixtures:
    pass:
    - name: ok
      text: |
        tasks:
          - id: a
            title: A
            owner: me
            status: done
    fail:
    - name: odd
      text: |
        tasks:
          - id: a
            title: A
            owner: me
            status: finished
- key: plan-depends-exist
  title: Dependencies point at tasks that exist
  domain: plan
  axis: Consistency
  kinds:
  - yaml
  - json
  detector: schema
  config:
    refs:
    - from: tasks[].depends_on[]
      to: tasks[].id
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A task cannot wait for one that is not there.
  fix: Fix the id or add the task.
  fixtures:
    pass:
    - name: ok
      text: |
        tasks:
          - id: a
            title: A
            owner: me
          - id: b
            title: B
            owner: me
            depends_on: [a]
    fail:
    - name: ghost
      text: |
        tasks:
          - id: b
            title: B
            owner: me
            depends_on: [zzz]
