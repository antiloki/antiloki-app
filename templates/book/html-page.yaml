# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/html-page.json replaces this one.
id: html-page
name: Web pages
description: 'A page a team built: title, description, one h1, alt text, language.'
axes:
- Search
- Accessibility
- Structure
kinds:
- html
version: 1
laws:
- key: page-title
  title: The page has a title of 10 to 60 characters
  domain: web
  axis: Search
  kinds:
  - html
  detector: count
  config:
    unit: file
    attr: title_len
    min: 10
    max: 60
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Search results show about 60 characters.
  fix: Write a title of 10 to 60 characters.
  fixtures:
    pass:
    - name: ok
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>Hello</h1></body></html>
    fail:
    - name: none
      text: <!doctype html><html lang="en"><head></head><body><h1>Hello</h1></body></html>
- key: page-description
  title: The meta description is 50 to 160 characters
  domain: web
  axis: Search
  kinds:
  - html
  detector: count
  config:
    unit: file
    attr: meta_description_len
    min: 50
    max: 160
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A description is what a search result quotes.
  fix: Write 50 to 160 characters.
  fixtures:
    pass:
    - name: ok
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>Hello</h1></body></html>
    fail:
    - name: none
      text: <!doctype html><html lang="en"><head><title>A good page title</title></head><body><h1>Hello</h1></body></html>
- key: page-one-h1
  title: Exactly one h1
  domain: web
  axis: Structure
  kinds:
  - html
  detector: structure
  config:
    check: single_h1
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: One main heading.
  fix: Keep one h1.
  fixtures:
    pass:
    - name: ok
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>Hello</h1></body></html>
    fail:
    - name: two
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>A</h1><h1>B</h1></body></html>
- key: page-alt-text
  title: Images have alt text
  domain: web
  axis: Accessibility
  kinds:
  - html
  detector: structure
  config:
    check: alt_text
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Every image says what it shows.
  fix: Add alt text.
  fixtures:
    pass:
    - name: ok
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>Hello</h1><img
        src="a.png" alt="A chart"></body></html>
    fail:
    - name: none
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>Hello</h1><img
        src="a.png"></body></html>
- key: page-lang
  title: The page declares its language
  domain: web
  axis: Accessibility
  kinds:
  - html
  detector: expr
  config:
    unit: file
    expr: '!has_lang'
    message: no lang attribute on <html>
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Screen readers need the language.
  fix: Add lang to <html>.
  fixtures:
    pass:
    - name: ok
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>Hello</h1></body></html>
    fail:
    - name: none
      text: <!doctype html><html><head><title>A good page title</title></head><body><h1>Hello</h1></body></html>
- key: page-no-placeholder
  title: No placeholder in the page
  domain: web
  axis: Completeness
  kinds:
  - html
  detector: pattern
  config:
    unit: file
    regex: lorem ipsum|\{\{[^}]+\}\}|\[(?:insert|your)[^\]]*\]
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A page ships with real text.
  fix: Replace it.
  fixtures:
    pass:
    - name: ok
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>Hello</h1><p>Real
        text.</p></body></html>
    fail:
    - name: lorem
      text: <!doctype html><html lang="en"><head><title>A good page title</title><meta name="description" content="dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd"></head><body><h1>Hello</h1><p>Lorem
        ipsum dolor.</p></body></html>
