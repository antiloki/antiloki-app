# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/code-docs.json replaces this one.
id: code-docs
name: Code documentation
description: 'What a source file is made of, for its generated documentation: design patterns, routes, configuration, what it touches. These laws document, they never judge. Write your own for your stack.'
axes:
- Design patterns
- HTTP routes
- Configuration
- Touches
kinds:
- code
version: 1
laws:
- key: doc-observer
  title: Observer (events and subscriptions)
  domain: docs
  axis: Design patterns
  kinds: &id001
  - code
  detector: pattern
  config:
    unit: file
    regex: \b(?:addEventListener|EventEmitter|\.emit\(|\.on\(\s*['"]|subscribe\()
    section: Design patterns
    label: Observer (events and subscriptions)
  severity: info
  weight: 0
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: 'Documents: Observer (events and subscriptions).'
  fix: ''
  fixtures:
    pass:
    - name: none
      text: |
        const a = 1;
    fail:
    - name: emit
      text: |
        bus.emit('x');
  purpose: doc
- key: doc-singleton
  title: Singleton
  domain: docs
  axis: Design patterns
  kinds: *id001
  detector: pattern
  config:
    unit: file
    regex: \b(?:getInstance|static\s+instance|let\s+instance\b)
    section: Design patterns
    label: Singleton
  severity: info
  weight: 0
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: 'Documents: Singleton.'
  fix: ''
  fixtures:
    pass:
    - name: none
      text: |
        const a = 1;
    fail:
    - name: get
      text: |
        class A { static getInstance() {} }
  purpose: doc
- key: doc-factory
  title: Factory
  domain: docs
  axis: Design patterns
  kinds: *id001
  detector: pattern
  config:
    unit: file
    regex: \b(?:function\s+create[A-Z]\w*|const\s+create[A-Z]\w*\s*=|\w*Factory\b)
    ignore_case: false
    section: Design patterns
    label: Factory
  severity: info
  weight: 0
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: 'Documents: Factory.'
  fix: ''
  fixtures:
    pass:
    - name: none
      text: |
        const a = 1;
    fail:
    - name: make
      text: |
        function createUser() {}
  purpose: doc
- key: doc-middleware
