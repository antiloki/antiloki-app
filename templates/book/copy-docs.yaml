# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/copy-docs.json replaces this one.
id: copy-docs
name: Copy documentation
description: 'What a piece of writing contains, for its generated documentation: claims and numbers, calls to action, questions, contact points.'
axes:
- Claims
- Calls to action
- Questions
- Contact points
kinds:
- markdown
- text
- html
version: 1
laws:
- key: doc-numbers
  title: Numbers and percentages
  domain: docs
  axis: Claims
  kinds: &id001
  - markdown
  - text
  - html
  detector: pattern
  config:
    unit: file
    regex: \b\d+(?:[.,]\d+)?\s?(?:%|x|×|\$|€|R\$|million|thousand|days?|hours?|minutes?|users|customers)
    section: Claims
    label: Numbers and percentages
  severity: info
  weight: 0
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: 'Documents: Numbers and percentages.'
  fix: ''
  fixtures:
    pass:
    - name: none
      text: |
        We help teams ship.
    fail:
    - name: pct
      text: |
        Cut costs by 40% in 3 days.
  purpose: doc
- key: doc-cta
  title: Call to action
  domain: docs
  axis: Calls to action
  kinds: *id001
  detector: pattern
  config:
    unit: file
    any:
    - buy now
    - sign up
    - get started
    - start free
    - try it
    - download
    - subscribe
    - book a demo
    - contact us
    - learn more
    - comece
    - assine
    - baixe
    section: Calls to action
    label: Call to action
  severity: info
  weight: 0
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: 'Documents: Call to action.'
  fix: ''
  fixtures:
    pass:
    - name: none
      text: |
        We help teams ship.
    fail:
    - name: cta
      text: |
        Get started today.
  purpose: doc
- key: doc-questions
  title: A question put to the reader
  domain: docs
  axis: Questions
  kinds: *id001
  detector: pattern
  config:
    unit: paragraph
    regex: \?(?:\s|$)
    section: Questions
    label: A question put to the reader
  severity: info
  weight: 0
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: 'Documents: A question put to the reader.'
  fix: ''
  fixtures:
    pass:
    - name: none
      text: |
        We help teams ship.
    fail:
    - name: q
      text: |
        Ready to ship faster?
  purpose: doc
- key: doc-contact
  title: An address to reach
  domain: docs
  axis: Contact points
  kinds: *id001
  detector: pattern
  config:
    unit: file
    regex: '[\w.+-]+@[\w-]+\.[\w.]+|https?://\S+'
    section: Contact points
    label: An address to reach
  severity: info
  weight: 0
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: 'Documents: An address to reach.'
  fix: ''
  fixtures:
    pass:
    - name: none
      text: |
        We help teams ship.
    fail:
    - name: mail
      text: |
        Write to hi@example.com.
  purpose: doc
