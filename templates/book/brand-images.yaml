# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/brand-images.json replaces this one.
id: brand-images
name: Images and graphics
description: Size and shape of images a team makes or keeps, read from the file header; SVG safety and accessibility. (Pixel-level checks such as contrast and sharpness are a later lens.)
axes:
- Quality
- Performance
- Security
- Accessibility
kinds:
- image
- svg
version: 1
laws:
- key: image-min-width
  title: Raster images are at least 800 px wide
  domain: media
  axis: Quality
  kinds:
  - image
  detector: count
  config:
    unit: file
    attr: width
    min: 800
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A small image is blurry when shown large.
  fix: Export it larger.
  fixtures:
    pass:
    - name: wide
      kind: image
      b64: iVBORw0KGgoAAAANSUhEUgAABkAAAAOECAYAAAAAAAAA
      text: ''
    fail:
    - name: small
      kind: image
      b64: iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyCAYAAAAAAAAA
      text: ''
- key: image-max-megapixels
  title: Images are at most 24 megapixels
  domain: media
  axis: Performance
  kinds:
  - image
  detector: count
  config:
    unit: file
    attr: megapixels
    max: 24
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A 48 MP image slows a page and a run.
  fix: Scale it down.
  fixtures:
    pass:
    - name: ok
      kind: image
      b64: iVBORw0KGgoAAAANSUhEUgAABkAAAAOECAYAAAAAAAAA
      text: ''
    fail:
    - name: huge
      kind: image
      b64: iVBORw0KGgoAAAANSUhEUgAAH0AAABdwCAYAAAAAAAAA
      text: ''
- key: image-aspect
  title: No extreme aspect ratio
  domain: media
  axis: Quality
  kinds:
  - image
  detector: expr
  config:
    unit: file
    expr: aspect < 0.4 || aspect > 2.5
    message: an extreme aspect ratio
  severity: info
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A banner of 7:1 is a decision, not an accident.
  fix: Crop or pad it.
  fixtures:
    pass:
    - name: ok
      kind: image
      b64: iVBORw0KGgoAAAANSUhEUgAABkAAAAOECAYAAAAAAAAA
      text: ''
    fail:
    - name: strip
      kind: image
      b64: iVBORw0KGgoAAAANSUhEUgAAC7gAAAGQCAYAAAAAAAAA
      text: ''
- key: svg-no-script
  title: An SVG carries no script
  domain: media
  axis: Security
  kinds:
  - svg
  detector: expr
  config:
    unit: file
    expr: has_script
    message: the SVG contains a script
  severity: critical
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A graphic does not run code.
  fix: Remove the script element.
  fixtures:
    pass:
    - name: ok
      kind: svg
      text: <svg width="10" height="10"><title>x</title><rect/></svg>
    fail:
    - name: script
      kind: svg
      text: <svg width="10" height="10"><script>alert(1)</script></svg>
- key: svg-has-title
  title: An SVG has a title
  domain: media
  axis: Accessibility
  kinds:
  - svg
  detector: expr
  config:
    unit: file
    expr: '!has_title'
    message: no <title> in the SVG
  severity: info
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A title is what a screen reader says.
  fix: Add a <title>.
  fixtures:
    pass:
    - name: ok
      kind: svg
      text: <svg width="10" height="10"><title>x</title><rect/></svg>
    fail:
    - name: none
      kind: svg
      text: <svg width="10" height="10"><rect/></svg>
