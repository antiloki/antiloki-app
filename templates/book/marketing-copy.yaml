# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/marketing-copy.json replaces this one.
id: marketing-copy
name: Marketing and copywriting
description: Tone, honesty and length of landing text, emails and ads, in English and Portuguese.
axes:
- Honesty
- Tone
- Clarity
- Completeness
kinds:
- markdown
- text
- html
version: 1
paths:
- copy/**
- '**/copy/**'
- marketing/**
- '**/marketing/**'
- '**/landing*'
- '**/email*'
- ads/**
- '**/ads/**'
- '**/*copy*'
laws:
- key: copy-no-superlatives
  title: No unsupported superlatives (English)
  domain: copy
  axis: Honesty
  kinds: []
  detector: pattern
  config:
    unit: file
    regex: \b(?:best|revolutionary|world-class|cutting-edge|game-changing|unbeatable|guaranteed|miracle)\b|#1\b
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A claim needs a source; an adjective is not one.
  fix: Replace the adjective with a number, a source or a plain fact.
  fixtures:
    pass:
    - name: plain
      text: |
        We help teams ship a release every week.
    fail:
    - name: hype
      text: |
        The best, revolutionary tool.
- key: copy-no-superlatives-pt
  title: Sem superlativos sem prova (português)
  domain: copy
  axis: Honesty
  kinds: []
  detector: pattern
  config:
    unit: file
    regex: \b(?:o melhor|a melhor|revolucionári[oa]|garantid[oa]|incrível|imbatível|milagros[oa]|número 1)\b
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Uma afirmação precisa de prova.
  fix: Troque o adjetivo por um número, uma fonte ou um fato.
  fixtures:
    pass:
    - name: ok
      text: |
        Ajudamos equipes a publicar toda semana.
    fail:
    - name: hype
      text: |
        A melhor ferramenta, simplesmente incrível.
- key: copy-no-placeholder
  title: No placeholder left in
  domain: copy
  axis: Completeness
  kinds: []
  detector: pattern
  config:
    unit: file
    regex: lorem ipsum|\[(?:insert|your|add)[^\]]*\]|\{\{[^}]+\}\}|your (?:name|company|product) here
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Copy ships with real words.
  fix: Write the real text.
  fixtures:
    pass:
    - name: ok
      text: |
        Hello Maria, thanks for signing up.
    fail:
    - name: slot
      text: |
        Hello {{first_name}}, thanks for signing up.
- key: copy-exclamations
  title: At most two exclamation marks
  domain: copy
  axis: Tone
  kinds: []
  detector: expr
  config:
    unit: file
    expr: exclamations > 2
    message: more than two exclamation marks
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Shouting is not persuasion.
  fix: Keep one or two.
  fixtures:
    pass:
    - name: calm
      text: |
        Welcome aboard! Let's begin.
    fail:
    - name: loud
      text: |
        Buy now! Today! Hurry!
- key: copy-no-shouting
  title: Not more than three words in capitals
  domain: copy
  axis: Tone
  kinds: []
  detector: expr
  config:
    unit: file
    expr: caps_words > 3
    message: too many words in capitals
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Capitals are for acronyms, not emphasis.
  fix: Use plain case; emphasise with structure.
  fixtures:
    pass:
    - name: ok
      text: |
        Buy now.
    fail:
    - name: caps
      text: |
        BUY NOW TODAY GREAT DEAL
- key: copy-sentence-length
  title: Sentences average at most 24 words
  domain: copy
  axis: Clarity
  kinds: []
  detector: count
  config:
    unit: file
    attr: avg_sentence_words
    max: 24
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Short sentences are read.
  fix: Split the longest sentences.
  fixtures:
    pass:
    - name: ok
      text: |
        We build tools. They are small. They are fast.
    fail:
    - name: long
      text: |
        word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word word.
