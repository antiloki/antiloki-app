# Shipped pack of the book (RFC 0018). Generated by build_seeds.py: edit there. A workspace copy in .antiloki/book/data-csv.json replaces this one.
id: data-csv
name: Tables and exports
description: 'CSV and TSV files: they parse, every row is as wide as the header, nothing repeats.'
axes:
- Integrity
- Completeness
kinds:
- csv
version: 1
laws:
- key: csv-parses
  title: The table parses
  domain: data
  axis: Integrity
  kinds:
  - csv
  detector: structure
  config:
    check: parses
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A table has a header and rows.
  fix: Fix or regenerate the file.
  fixtures:
    pass:
    - name: ok
      text: |
        a,b
        1,2
    fail:
    - name: empty
      text: ''
- key: csv-rectangular
  title: Every row is as wide as the header
  domain: data
  axis: Integrity
  kinds:
  - csv
  detector: structure
  config:
    check: csv_rectangular
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A ragged row is a broken row.
  fix: Quote the field that holds a comma.
  fixtures:
    pass:
    - name: ok
      text: |
        a,b
        1,2
    fail:
    - name: ragged
      text: |
        a,b
        1,2,3
- key: csv-no-duplicate-rows
  title: No row twice
  domain: data
  axis: Integrity
  kinds:
  - csv
  detector: structure
  config:
    check: no_duplicate_rows
  severity: warn
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A row appears once.
  fix: Remove the repeat.
  fixtures:
    pass:
    - name: ok
      text: |
        a,b
        1,2
        3,4
    fail:
    - name: dup
      text: |
        a,b
        1,2
        1,2
- key: csv-unique-header
  title: Column names are unique
  domain: data
  axis: Integrity
  kinds:
  - csv
  detector: structure
  config:
    check: unique_header
  severity: error
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: A column has one name.
  fix: Rename the repeated column.
  fixtures:
    pass:
    - name: ok
      text: |
        a,b
        1,2
    fail:
    - name: dup
      text: |
        a,a
        1,2
- key: csv-no-empty-cells
  title: No empty cell
  domain: data
  axis: Completeness
  kinds:
  - csv
  detector: expr
  config:
    unit: file
    expr: empty_cells > 0
    message: the table has empty cells
  severity: info
  weight: 5
  confidence: 1.0
  status: ratified
  version: 1
  created_by: seed
  rule: Leads and records are complete.
  fix: Fill or remove the row.
  fixtures:
    pass:
    - name: ok
      text: |
        a,b
        1,2
    fail:
    - name: hole
      text: |
        a,b
        1,
