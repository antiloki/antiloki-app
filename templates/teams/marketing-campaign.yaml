        url: "{ask}"
      name: fetch
      type: web
  stop:
    cap_usd: null
    label: null
    message: "The page could not be read: check the address, and that it is public."
    node: stop
    timeout_s: null
  strategy:
    agent:
      brief: "The product page text is in what the step before you found; the team's ask may add a goal or a channel. Do not fetch, browse or search anything yourself: if the text is empty or unreadable say so and stop. Write: who this is for (one sentence, from the page only), the three strongest angles (each: the promise, the proof the page itself gives, the objection it must answer), and what NOT to claim because the page does not support it. No invented numbers, customers or awards. Reply with the finished text only. You have no tools and no files in this step: never mention a missing permission, never promise to write or fetch anything, and never ask a question; if something you need is missing from what you were given, say what is missing in one line and still give your best answer from what you have."
      context: []
