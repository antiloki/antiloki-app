    timeout_s: null
  next:
    agent:
      brief: "The team's ask is the person's pipeline, pasted as text: one deal per line or row, with whatever columns they keep (name, stage, value, last contact, notes), and perhaps a focus ('deals gone quiet'). For each OPEN deal write: the deal, where it stands in one line (from the row only), the single next action (call, email, wait, close it), and when it should happen (today, this week, next week). Sort by value times closeness to closing; if a focus was given, put those first. Deals marked closed or lost are listed at the end as closed, without an action. Never invent a fact the row does not hold; say 'not in the pipeline'. Reply with the finished text only. You have no tools and no files in this step: never mention a missing permission, never promise to write or fetch anything, and never ask a question; if something you need is missing from what you were given, say what is missing in one line and still give your best answer from what you have."
