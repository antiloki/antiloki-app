# antiloki branch file (strict YAML subset, see RFC 0015). Edit it, then check it: the hash says whether it was changed by hand.
schema: antiloki-branch/1
name: recreate-webapp
version: "1.0.0"
description: "Studies a web app (you sign in once in a window), draws its screens for your approval, then writes the report and the code for a native pane."
license: proprietary
template:
  ask: "the app's name: a file in .antiloki/browse-targets/ (url, domains, pages, widths, what a signed-in page must contain)"
  category: recreate
  kind: team
  lineage:
    team: recreate-webapp
  needs:
    - browse
    - a human step
  proven_by_run: recreate-webapp-213574126
  status: verified
settings:
  budget_usd: 6.0
start:
  - login
nodes:
  capture:
    allow:
      effects:
        - network
        - read
      mcp: []
      panes: []
      paths: []
      skills: []
    cap_usd: null
    label: Look at the app
    node: use_tool
    outputs:
      count: int
      dir: string
      shots: list
    starts_model: false
    timeout_s: null
    tool:
      args:
        domains:
          - github.com
        profile: app
        target: "{ask}"
        urls:
          - https://github.com/antiloki/antidrive
          - https://github.com/antiloki/antidrive/issues
          - https://github.com/antiloki/antidrive/issues/8
          - https://github.com/antiloki/antidrive/pulls
          - https://github.com/antiloki/antidrive/blob/main/README.md
          - https://github.com/antiloki/antidrive/tree/main/src
          - https://github.com/antiloki
          - https://github.com/settings/profile
          - https://github.com/settings/organizations
          - https://github.com/notifications
        widths:
          - 1440
          - 768
          - 390
      name: capture
      type: browse
  code_doc:
    cap_usd: null
    format: txt
    from: coder
    label: null
    name: pane-code
    node: artifact
    timeout_s: null
    title: null
  coder:
    agent:
      brief: "The app is the one named in the team's ask. Write the code for a React pane that draws the approved frames from the app's data, read through its MCP. The `reference/` folder of the project holds `pattern/` (a FINISHED pane, Linear's: copy its pattern exactly: a pure data file with defensive parsers, one pane file, `appRead(app, tool, args)` for every call, `RichText` for text with pictures and videos) and `<app>/` (the app's tools with their arguments, and real sample answers). READ ONLY in the first version of a new app. Files to write: `<App>Pane.tsx` and `<app>.ts` (and a test file for the parsers). Use plain inline style objects, no libraries. Put ALL the code in ONE text file `.antiloki/artifacts/pane-code.txt`, each file introduced by a line `=== path/File.tsx ===`. At the very top of that file write a SHORT note for a PERSON, not a machine: at most six short lines in plain words, with no test ids, no pixel numbers and no lists of names: what the pane looks like now, what is still missing, and the one thing to check first. Everything technical goes in a second file, `.antiloki/artifacts/technical-notes.md`, never in pane-code.txt. You edit no file of the project: the person applies your code."
      context: []
      effects:
        - read
        - document
      mcp: []
      responsibility: "Write the app's pane code from the approved frames"
      skills: []
      title: Web app pane coder
    cap_usd: 3.0
    fresh_context: null
    label: null
    model: null
    node: role
    owns: []
    parallel: null
    readonly: null
    role: agent
    tier: null
    timeout_s: null
  deliver:
    cap_usd: null
    label: null
    node: deliver
    timeout_s: null
  design_gate:
    approval:
      note: "These frames are what the pane will look like. Approve to have the code written, or decline to stop and say what to change. Nothing in antiloki is changed by this team."
      risk: low
      show: frames
    cap_usd: null
    gate: review
    label: "Is this the design?"
    node: human
    on_timeout: stay
    timeout_s: null
  designer:
    agent:
      brief: "The app is the one named in the team's ask. The step before you saved screenshots (PNG) and a reading of each page (JSON: fonts, colours by area, blocks with their boxes, first words) at 1440, 768 and 390 px for every page the capture visited; their paths are listed in what the nodes before you found. Read them all. Write ONE self-contained HTML page (no scripts, no external files; inline CSS only) to `.antiloki/artifacts/frames.html`. COVERAGE IS THE POINT: draw one frame for EACH kind of screen the capture visited, grouped by kind: home or repository, file view, folder view, issues list, issue open, pull requests, profile, organization or settings, notifications; plus the narrow 390 px view of the main screens and a search or empty state where one was captured. A kind with no capture is listed under 'Not captured' with its reason, never invented. Use the real colours, fonts and spacing from the readings, never guesses; where a value was not read say so in the caption. Under each frame write ONE plain sentence a person can read; put measured numbers in a small collapsed `<details>` under it. Do not copy the app's logo or marks. Do not touch any project file."
      context: []
      effects:
        - read
        - document
      mcp: []
      responsibility: "Turn what the browser saw of an app into mock screens to approve, one frame for every kind of screen it saw"
      skills: []
      title: Web app designer
    cap_usd: 2.0
    fresh_context: null
    label: null
    model: null
    node: role
    owns: []
    parallel: null
    readonly: null
    role: agent
    tier: null
    timeout_s: null
  frames_doc:
    cap_usd: null
    format: html
    from: designer
    label: null
    name: frames
    node: artifact
    timeout_s: null
    title: null
  leader:
    cap_usd: null
    label: null
    node: leader
    timeout_s: null
  login:
    allow:
      effects:
        - network
      mcp: []
      panes: []
      paths: []
      skills: []
    cap_usd: null
    label: Sign in to the app
    node: use_tool
    outputs:
      closed: bool
    starts_model: false
    timeout_s: null
    tool:
      args:
        mark: true
        target: "{ask}"
        wait_s: 900
      name: login
      type: browse
  signed_in:
    approval:
      note: "A browser window opened on the app for you to sign in. Sign in there and leave the window open, then approve here: antiloki looks at your app through that same window, closes it, and a designer reads the screenshots. They show your workspace's data."
      risk: low
    cap_usd: null
    gate: review
    label: "Signed in to the app?"
    node: human
    on_timeout: stay
    timeout_s: null
  stop_capture:
    cap_usd: null
    label: null
    message: "The app did not show a signed-in page when it was looked at. Sign in in the window the login step opens, keep it open, then run the team again."
    node: stop
    timeout_s: null
edges:
  - from: login
    port: out
    to: signed_in
  - from: signed_in
    port: approved
    to: capture
  - from: capture
    port: out
    to: designer
  - from: capture
    port: failed
    to: stop_capture
  - from: capture
    port: error
    to: stop_capture
  - from: designer
    port: out
    to: frames_doc
  - from: frames_doc
    port: out
    to: design_gate
  - from: design_gate
    port: approved
    to: coder
  - from: coder
    port: out
    to: code_doc
  - from: code_doc
    port: out
    to: deliver
