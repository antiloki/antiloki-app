<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>good-shop (fixture: a clean product page)</title>
<!-- KNOWN GOOD (bench/design/fixtures/EXPECT.json): 8px spacing scale, 3 font sizes (14/16/32), 2 weights (400/600),
     AA contrast everywhere, one accent, left edges aligned, 40px tap targets, hover + focus-visible states on every control. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1f2937;--muted:#4b5563;--line:#d1d5db;--bg:#f9fafb;--panel:#ffffff;--thumb:#e5e7eb;--accent:#1d4ed8;--accent-dark:#1e40af}
body{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;font-weight:400;color:var(--ink);background:var(--bg)}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:600}
.links{display:flex;gap:8px}
.links a{display:block;min-height:40px;padding:8px 16px;font-size:14px;line-height:24px;color:var(--ink);text-decoration:none;border-radius:8px}
.links a:hover{background:var(--bg);color:var(--accent)}
.links a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:48px 32px}
h1{font-size:32px;line-height:40px;font-weight:600;margin-bottom:8px}
.lede{color:var(--muted);margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{display:flex;flex-direction:column;gap:8px;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.thumb{height:128px;background:var(--thumb);border-radius:8px}
.card h2{font-size:16px;line-height:24px;font-weight:600}
.card p{font-size:14px;color:var(--muted)}
.price{font-size:16px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;margin-top:8px;padding:8px 16px;font-family:inherit;font-size:14px;line-height:24px;font-weight:600;color:#ffffff;background:var(--accent);border:1px solid var(--accent);border-radius:8px;cursor:pointer}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
footer{padding:32px;text-align:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<nav>
  <span class="brand">ministore</span>
  <div class="links"><a href="#shop">Shop</a><a href="#about">About</a><a href="#cart">Cart</a></div>
</nav>
<main>
  <h1>Fewer things, made well</h1>
  <p class="lede">Six objects for a quiet home.</p>
  <section class="grid">
    <article class="card"><div class="thumb"></div><h2>Stone mug</h2><p>Hand-thrown stoneware, 300 ml.</p><span class="price">$18</span><button class="btn" type="button">Add to cart</button></article>
    <article class="card"><div class="thumb"></div><h2>Paper lamp</h2><p>Warm light, folded by hand.</p><span class="price">$64</span><button class="btn" type="button">Add to cart</button></article>
    <article class="card"><div class="thumb"></div><h2>Oak chair</h2><p>Solid oak, oiled finish.</p><span class="price">$240</span><button class="btn" type="button">Add to cart</button></article>
  </section>
</main>
<footer>Free shipping on orders over $100</footer>
</body>
</html>
