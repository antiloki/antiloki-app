<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>good-form (fixture: a clean checkout form)</title>
<!-- KNOWN GOOD: 8px scale, 3 font sizes (14/16/24), 2 weights, AA contrast, labels above inputs on one left edge,
     40px controls, styled select/input/button with hover + focus states. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#111827;--muted:#4b5563;--line:#d1d5db;--bg:#f3f4f6;--panel:#ffffff;--accent:#047857;--accent-dark:#065f46;--ring:#6ee7b7}
body{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;font-weight:400;color:var(--ink);background:var(--bg)}
.page{max-width:960px;margin:0 auto;padding:48px 32px}
.back{display:inline-flex;align-items:center;min-height:40px;padding:8px 0;margin-bottom:16px;font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent);text-decoration:underline}
.back:focus-visible,.pay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:24px;line-height:32px;font-weight:600;margin-bottom:32px}
.layout{display:grid;grid-template-columns:2fr 1fr;gap:32px;align-items:start}
.panel{padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
label{font-size:14px;line-height:24px;font-weight:600}
input,select{width:100%;height:40px;padding:8px 16px;font-family:inherit;font-size:16px;line-height:24px;color:var(--ink);background:#ffffff;border:1px solid var(--line);border-radius:8px}
input:hover,select:hover{border-color:var(--muted)}
input:focus,select:focus{outline:2px solid var(--ring);outline-offset:0;border-color:var(--accent)}
.pay{display:flex;align-items:center;justify-content:center;min-height:40px;margin-top:8px;padding:8px 16px;font-family:inherit;font-size:16px;line-height:24px;font-weight:600;color:#ffffff;background:var(--accent);border:1px solid var(--accent);border-radius:8px;cursor:pointer}
.pay:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.summary h2{font-size:16px;line-height:24px;font-weight:600;margin-bottom:16px}
.line{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:var(--muted)}
.total{display:flex;justify-content:space-between;padding-top:16px;margin-top:8px;font-size:16px;font-weight:600;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="#cart">Back to cart</a>
  <h1>Checkout</h1>
  <div class="layout">
    <form class="panel form" onsubmit="return false">
      <div class="field"><label for="name">Full name</label><input id="name" type="text" value="Ada Lovelace"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="text" value="ada@example.com"></div>
      <div class="field"><label for="addr">Address</label><input id="addr" type="text" value="12 Analytical Way"></div>
      <div class="three">
        <div class="field"><label for="city">City</label><input id="city" type="text" value="London"></div>
        <div class="field"><label for="ship">Shipping</label><select id="ship"><option>Standard</option><option>Express</option></select></div>
        <div class="field"><label for="zip">Postcode</label><input id="zip" type="text" value="N1 9GU"></div>
      </div>
      <button class="pay" type="button">Pay $82</button>
    </form>
    <aside class="panel summary">
      <h2>Order summary</h2>
      <div class="line"><span>Stone mug x 1</span><span>$18</span></div>
      <div class="line"><span>Paper lamp x 1</span><span>$64</span></div>
      <div class="total"><span>Total</span><span>$82</span></div>
    </aside>
  </div>
</div>
</body>
</html>
